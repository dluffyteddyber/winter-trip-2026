<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout follows winter-trip.html: a swimlane timeline for 3–13 Dec leads; itinerary, decisions and bookings follow in a two-column grid that stacks on phones. Wider day columns than the master keep every label readable. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18212D; --muted:#5A6573; --line:#D5DBE2;
  --accent:#C2362B;
  --c-me:#C2362B; --c-family:#7B4B8E; --c-family2:#5257A3; --c-family3:#2F7397; --c-hong:#B2456E; --c-cal:#6B7A1E; --c-frankie:#1E7A70; --c-keat:#B4761A; --c-trip:#3C5A8A; --c-travel:#18212D; --c-home:#5A6573; --c-ok:#1E7A70;
  --weekend:rgba(60,90,138,.07);
  --f-display:"Familjen Grotesk","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","PingFang TC","Microsoft JhengHei",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --surface:#161D27; --ink:#E5E9EF; --muted:#98A3B2; --line:#2A3443;
    --accent:#EA5A4E;
    --c-me:#EA5A4E; --c-family:#B98CCB; --c-family2:#9DA1E6; --c-family3:#7BB8D9; --c-hong:#E07AA0; --c-cal:#B5C55A; --c-frankie:#4DB5A9; --c-keat:#E3A748; --c-trip:#7D9BCC; --c-travel:#E5E9EF; --c-home:#98A3B2; --c-ok:#4DB5A9;
    --weekend:rgba(125,155,204,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --ink:#E5E9EF; --muted:#98A3B2; --line:#2A3443;
  --accent:#EA5A4E;
  --c-me:#EA5A4E; --c-family:#B98CCB; --c-family2:#9DA1E6; --c-family3:#7BB8D9; --c-hong:#E07AA0; --c-cal:#B5C55A; --c-frankie:#4DB5A9; --c-keat:#E3A748; --c-trip:#7D9BCC; --c-travel:#E5E9EF; --c-home:#98A3B2; --c-ok:#4DB5A9;
  --weekend:rgba(125,155,204,.07);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-block:36px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:start}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{color:inherit}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5.2vw,46px);line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.lede{margin:12px 0 0;max-width:70ch;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:10px 32px;margin:18px 0 0;padding:0}
.facts div{display:grid;gap:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px;min-width:0}
.panel-head{display:grid;gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:10px 22px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seggrp{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seggrp button{font:500 13px var(--f-mono);background:transparent;color:var(--ink);border:0;padding:5px 10px;cursor:pointer}
.seggrp button+button{border-left:1px solid var(--line)}
.seggrp button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tl-scroll{overflow-x:auto;margin:0 -20px;padding:0 20px 4px}
.tl{display:grid;grid-template-columns:104px repeat(11,minmax(0,1fr));min-width:940px;position:relative}
.col{z-index:0}
.col.we{background:var(--weekend)}
.col.pre{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 35%,transparent) 8px 9px)}
.mo{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);padding-left:6px;z-index:1;align-self:end}
.dn,.dw{font-family:var(--f-mono);font-size:13px;text-align:center;z-index:1;font-variant-numeric:tabular-nums;align-self:center}
.dw{font-size:11px;color:var(--muted)}
.dn.we,.dw.we{color:var(--c-trip)}
.lab{position:sticky;left:0;z-index:4;background:var(--surface);display:flex;flex-direction:column;justify-content:center;padding-right:10px;border-right:1px solid var(--line);font-size:13px;font-weight:600;line-height:1.2}
.lab small{font-weight:400;color:var(--muted);font-size:11px}
.lab.gap{border-top:1px solid var(--line)}
.seg{--c:var(--ink);--fill:color-mix(in srgb,var(--c) 17%,var(--surface));--fill2:color-mix(in srgb,var(--c) 6%,var(--surface));
  margin:5px 2px;border-radius:5px;background:var(--fill);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  font-size:12.5px;font-weight:500;padding:0 8px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;z-index:1;min-width:0}
.seg span{overflow:hidden;text-overflow:ellipsis}
.seg.tent{background:repeating-linear-gradient(135deg,var(--fill) 0 6px,var(--fill2) 6px 11px);border-style:dashed}
.off{z-index:1;margin:6px 4px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.ms{position:relative;z-index:2}
.ms .dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.ms .ml{position:absolute;left:calc(50% - 4px);font-size:12px;font-weight:600;white-space:nowrap;line-height:1}
.ms .ml.top{top:2px}.ms .ml.bot{bottom:2px}
.ms .ml.end{left:auto;right:calc(50% - 4px)}
.ms::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted)}
.legend > span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:12px;border-radius:3px;border:1px solid var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 18%,var(--surface))}
.sw.tent{border-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 22%,var(--surface)) 0 4px,var(--surface) 4px 7px)}

.alert{--c:var(--accent);display:grid;gap:4px;padding:12px 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 8%,var(--surface));font-size:14px}
.alert.ok{--c:var(--c-ok)}
.alert b{color:var(--c);font-weight:600}

.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:28px;min-width:0}
section{display:grid;gap:14px;min-width:0}

.itin{list-style:none;margin:0;padding:0;display:grid}
.itin li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.itin li:last-child{border-bottom:1px solid var(--line)}
.itin li.pre .t,.itin li.pre .n{color:var(--muted)}
.itin .d{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:1px}
.itin .t{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.itin .n{color:var(--muted);font-size:14px}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ideas span{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.ideas em{font-style:normal;font-family:var(--f-mono);color:var(--muted)}
.tag{font:500 11px var(--f-mono);letter-spacing:.04em;padding:0 6px;border-radius:4px;border:1px solid currentColor;color:var(--c-trip)}
.tag.leave{color:var(--accent)}
.tag.sleep{color:var(--c-keat)}
@media (max-width:480px){.itin li{grid-template-columns:minmax(0,1fr);gap:2px}}

.dec{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dec li{display:grid;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.dec .h{display:flex;gap:8px;align-items:center;font-weight:600}
.chip{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;border:1px solid currentColor;flex:none}
.chip.clash{color:var(--accent)}
.chip.open{color:var(--c-keat)}
.chip.check{color:var(--c-trip)}
.dec p{margin:0;color:var(--muted);font-size:14px}

.opts{list-style:none;margin:0;padding:0;display:grid}
.opts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.opts li:last-child{border-bottom:1px solid var(--line)}
.opts b{font-weight:600}
.opts .tm{font:12px var(--f-mono);color:var(--muted);white-space:nowrap;text-align:right}
.opts p{grid-column:1 / -1;margin:0;color:var(--muted);font-size:14px}
.opts li.on b::after{content:attr(data-on);margin-left:8px;font:500 11px var(--f-mono);padding:0 6px;border-radius:4px;border:1px solid currentColor;color:var(--c-trip)}

.know{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.know b{color:var(--ink);font-weight:600}

.check{list-style:none;margin:0;padding:0;display:grid}
.check li{border-top:1px solid var(--line)}
.check label{display:flex;gap:10px;align-items:baseline;padding:8px 0;cursor:pointer;font-size:14px}
.check input{accent-color:var(--accent);transform:translateY(2px)}
.check .when{margin-left:auto;font:12px var(--f-mono);color:var(--muted);white-space:nowrap;padding-left:8px}
.check input:checked ~ .what{color:var(--muted);text-decoration:line-through}
.note{font-size:13px;color:var(--muted);margin:0}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <div class="eyebrow"><a id="back" href="../winter-trip.html" data-en="← Winter 2026–27" data-zh="← 冬日行程 2026–27"></a> · <span data-en="Part 1" data-zh="第一段"></span> · LHR → 上海 → <span id="eb-next"></span></div>
      <div class="seggrp" data-k="lang" aria-label="Language 語言"><button type="button" data-v="en" lang="en">EN</button><button type="button" data-v="zh" lang="zh-Hant">中文</button></div>
    </div>
    <h1 data-en="上海 Shanghai · 5–13 Dec" data-zh="上海 · 12.5 – 12.13"></h1>
    <p class="lede" data-en="The opening stretch of the winter trip. You land late on 12.5, the family is already in Shanghai, and the next day is 姨媽's race and birthday. Then come four days of annual leave around Shanghai, and on 12.9 a choice: go to Wuhan with the family, go ahead to Hong Kong, or stay on in Shanghai. Remote work starts on 12.14." data-zh="冬日行程的第一段。你 12.5 深夜抵達時家人已在上海，第二天是姨媽的跑馬和生日。之後在上海放四天年假，到 12.9 要做決定：跟家人去武汉、先去香港，或留在上海。12.14 開始遠程工作。"></p>
    <dl class="facts">
      <div><dt data-en="Dates" data-zh="日期"></dt><dd data-en="Sat 5 – Sun 13 Dec" data-zh="12.5 週六 – 12.13 週日"></dd></div>
      <div><dt data-en="Flight in" data-zh="去程航班"></dt><dd data-en="CZ3596 · 虹桥 22:10 · booked" data-zh="CZ3596 · 虹桥 22:10 · 已訂"></dd></div>
      <div><dt data-en="Annual leave" data-zh="年假"></dt><dd>12.7 – 12.11</dd></div>
      <div><dt data-en="After Shanghai" data-zh="上海之後"></dt><dd id="f-after"></dd></div>
      <div><dt data-en="Family" data-zh="家人"></dt><dd>姨媽 明 · 亮 · 许嵩 · 红</dd></div>
      <div><dt data-en="Friends" data-zh="朋友"></dt><dd id="f-friends"></dd></div>
    </dl>
  </header>

  <div class="panel">
    <div class="panel-head">
      <h2 data-en="Who's where, day by day" data-zh="每日行蹤"></h2>
      <div class="controls">
        <div class="ctrl"><span data-en="After Shanghai, 達" data-zh="上海之後，達"></span>
          <div class="seggrp" data-k="da"><button type="button" data-v="wuhan" data-en="Wuhan" data-zh="去武汉"></button><button type="button" data-v="hk" data-en="HK first" data-zh="先去香港"></button><button type="button" data-v="sh" data-en="Stay in SH" data-zh="留上海"></button></div>
        </div>
        <div class="ctrl"><span data-en="Frankie in Shanghai" data-zh="Frankie 來上海"></span>
          <div class="seggrp" data-k="fr"><button type="button" data-v="yes" data-en="from 12.8" data-zh="12.8 起"></button><button type="button" data-v="no" data-en="no" data-zh="不來"></button></div>
        </div>
        <div class="ctrl"><span>Calvin 曾致</span>
          <div class="seggrp" data-k="cal"><button type="button" data-v="7" data-en="Mon 12.7" data-zh="12.7 週一"></button><button type="button" data-v="8" data-en="Tue 12.8" data-zh="12.8 週二"></button><button type="button" data-v="no" data-en="not meeting" data-zh="不見面"></button></div>
        </div>
      </div>
    </div>
    <div class="tl-scroll"><div class="tl" id="tl"></div></div>
    <div class="legend">
      <span><i class="sw" style="--c:var(--c-me)"></i><span data-en="You in Shanghai" data-zh="你在上海"></span></span>
      <span><i class="sw" style="--c:var(--c-trip)"></i><span data-en="Away from Shanghai" data-zh="離開上海"></span></span>
      <span><i class="sw" style="--c:var(--c-travel)"></i><span data-en="Travel day" data-zh="交通日"></span></span>
      <span><i class="sw tent"></i><span data-en="Tentative / to decide" data-zh="暫定／待決定"></span></span>
      <span><i class="sw" style="background:var(--weekend);border-color:var(--line)"></i><span data-en="Weekend" data-zh="週末"></span></span>
      <span><i class="off" style="margin:0;width:22px;height:14px" data-en="AL" data-zh="假"></i><span data-en="Annual leave" data-zh="年假"></span></span>
    </div>
    <div class="alert" id="keat-alert"></div>
  </div>

  <div class="grid2">
    <section>
      <h2 data-en="Itinerary" data-zh="行程"></h2>
      <p class="note" id="itin-note"></p>
      <ol class="itin" id="itin"></ol>
    </section>

    <div class="stack">
      <section>
        <h2 data-en="Decide next" data-zh="待決定"></h2>
        <ul class="dec" id="dec"></ul>
      </section>

      <section>
        <h2 data-en="Day trips from Shanghai" data-zh="上海一日遊"></h2>
        <ul class="opts" id="opts"></ul>
        <p class="note" data-en="Train times are typical high-speed ranges from Shanghai, not December timetables." data-zh="時間為從上海出發的一般高鐵車程，並非 12 月實際班次。"></p>

        <h2 data-en="Good to know" data-zh="出發前須知"></h2>

        <ul class="check" id="check"></ul>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
  // Dates and people follow winter-trip.html (its default plan). Timeline runs 12.3–12.13 so the family's arrival shows.
  var START = Date.UTC(2026,11,3), N = 11;
  function ix(d){ return d-3; }
  function day(i){ return new Date(START+i*864e5); }
  var LEAVE = [ix(7),ix(8),ix(9),ix(10),ix(11)];

  // Language: shares the main page's saved choice, so switching on either page carries over.
  var L = 'en';
  try{ L = localStorage.getItem('wt-lang') || ((navigator.language||'').toLowerCase().indexOf('zh')===0 ? 'zh' : 'en'); }catch(e){}
  if (location.hash==='#zh' || location.hash==='#en') L = location.hash.slice(1);
  if (L!=='zh') L='en';
  function tr(en,zh){ return L==='zh' ? zh : en; }

  var WK_ZH = ['日','一','二','三','四','五','六'], WK_EN = ['S','M','T','W','T','F','S'], WKD_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function fmtD(i){ var d=day(i), w=d.getUTCDay(); return '12.'+d.getUTCDate()+' '+tr(WKD_EN[w],'週'+WK_ZH[w]); }
  function place(k){ return {sh:tr('Shanghai','上海'), wh:tr('Wuhan','武汉'), hk:tr('Hong Kong','香港'), hz:tr('Hangzhou','杭州')}[k]; }

  var FILE = location.protocol==='file:';
  document.getElementById('back').href = FILE ? '../winter-trip.html' : 'https://claude.ai/artifact/FEYHby63Saqhs89FYQgqjU';

  var state = {da:'wuhan', fr:'yes', cal:'7'};
  try{
    var s = JSON.parse(localStorage.getItem('sh-state2')||'{}');
    if (['wuhan','hk','sh'].indexOf(s.da)>-1) state.da=s.da;
    if (['yes','no'].indexOf(s.fr)>-1) state.fr=s.fr;
    if (['7','8','no'].indexOf(s.cal)>-1) state.cal=s.cal;
  }catch(e){}
  function save(){ try{ localStorage.setItem('sh-state2',JSON.stringify(state)); }catch(e){} }
  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  // Your days 12.5–12.13. s = timeline label, c = colour token, t/n = itinerary title and note, food = [chip, note], sleep = place key for the night.
  function plan(){
    var fr = state.fr==='yes', d = {};
    d[ix(5)] = {s:tr('Arrive','到上海'), c:'--c-travel', sleep:'sh',
      t:tr('You land at Hongqiao 22:10 · CZ3596','22:10 抵達虹桥 · CZ3596'),
      n:tr('Booked. 红 lands at Pudong at 14:20 the same day (CZ6543), and the rest of the family has been here since 12.3. It\'s late, so take a taxi straight to bed: 姨媽 races in the morning.',
           '已訂。红同日 14:20 抵達浦東（CZ6543），其他家人 12.3 已到。到得很晚，直接坐的士回去睡覺：姨媽明早要跑馬。'), food:[]};
    d[ix(6)] = {s:tr('Race day','跑馬 + 生日'), c:'--c-me', sleep:'sh',
      t:tr('姨媽\'s race + birthday','姨媽跑馬 + 生日'),
      n:tr('Cheer 姨媽 (明) on in the morning and meet her at the finish. She rests in the afternoon, then the whole family celebrates her birthday in the evening. She heads to Wuhan on 12.9, so keep the next days gentle.',
           '早上為姨媽（明）打氣，在終點接她。下午讓她休息，晚上全家為她慶生。她 12.9 去武汉，之後幾天行程放輕鬆。'),
      food:[[tr('Birthday dinner','生日晚餐'),tr('the big meal','今天的重頭戲')]]};
    d[ix(7)] = {s:tr('City day','市區'), c:'--c-me', leave:true, sleep:'sh',
      t:tr('Easy city day','輕鬆市區遊'),
      n:tr('Gentle pace while 姨媽 recovers: the former French Concession (武康路, 安福路), cafés, and the Bund 外滩 at dusk.',
           '姨媽跑完要休息，節奏放慢：逛前法租界（武康路、安福路）、咖啡店，黃昏去外滩。'),
      food:[['本帮菜','红烧肉'],['葱油拌面',tr('scallion noodles','')]]};

  function renderTimeline(d){
    var FAM = family();
    var lanes = [
      {k:'ms', name:tr('Moments','時刻'), sub:'', h:54},
      {k:'me', name:'達', sub:tr('You','我'), h:40},
      {k:'sleep', name:tr('Sleep','住'), sub:tr('Where you sleep','住宿地點'), h:32},
      {k:'al', name:tr('Leave','年假'), sub:'', h:28}
    ].concat(FAM.map(function(p){ return {k:p.k, name:p.name, sub:p.sub||tr('Family','家人'), h:32}; }))
     .concat([{k:'cal', name:'Calvin', sub:'曾致', h:32},{k:'fr', name:'Frankie', sub:tr('Friend','朋友'), h:32},{k:'keat', name:'Keat', sub:tr('Friend','朋友'), h:32}]);
    var tl = document.getElementById('tl');
    tl.style.gridTemplateRows = '20px 22px 18px ' + lanes.map(function(l){return l.h+'px';}).join(' ');
    var h = [];
    var col = function(a,b){ return 'grid-column:'+(a+2)+' / '+(b+3)+';'; };
    var rowOf = function(k){ return lanes.findIndex(function(l){return l.k===k;})+4; };

    for (var i=0;i<N;i++){
      var w = day(i).getUTCDay(), we = (w===0||w===6);
      h.push('<div class="col'+(we?' we':'')+(i<ix(5)?' pre':'')+'" style="grid-row:1 / -1;grid-column:'+(i+2)+'"></div>');
      h.push('<div class="dn'+(we?' we':'')+'" style="grid-row:2;grid-column:'+(i+2)+'">'+day(i).getUTCDate()+'</div>');
      h.push('<div class="dw'+(we?' we':'')+'" style="grid-row:3;grid-column:'+(i+2)+'">'+tr(WK_EN[w],WK_ZH[w])+'</div>');
    }
    h.push('<div class="mo" style="grid-row:1;'+col(0,N-1)+'">'+tr('DEC 2026','2026年12月')+'</div>');
    h.push('<div class="lab" style="grid-row:1 / 4;grid-column:1"></div>');
    lanes.forEach(function(l,r){
      h.push('<div class="lab'+(l.k==='ming'||l.k==='cal'?' gap':'')+'" style="grid-row:'+(r+4)+';grid-column:1">'+esc(l.name)+(l.sub?'<small>'+esc(l.sub)+'</small>':'')+'</div>');
    });

    function seg(lane,a,b,text,c,tent,tip){
      h.push('<div class="seg'+(tent?' tent':'')+'" style="grid-row:'+rowOf(lane)+';'+col(a,b)+'--c:var('+c+')" title="'+esc(tip||text)+'"><span>'+esc(text)+'</span></div>');
    }
    // Merge neighbouring days with the same key so multi-day stays read as one bar.
    function runs(lane, key, label, colourOf){
      var a=ix(5);
      for (var j=a+1;j<=N;j++){
        if (j===N || d[j][key]!==d[a][key]){ seg(lane, a, j-1, label(d[a]), colourOf(d[a]), false, d[a].t); a=j; }
      }
    }

    [
      [ix(3),tr('Family lands','家人抵滬'),'top',''],
      [ix(5),tr('達 lands 22:10','達 22:10 抵滬'),'bot',''],
      [ix(6),'姨媽 跑馬 + 生日','top',''],
      [ix(9),tr('红 flies · family → 武汉','红回程 · 家人去武汉'),'bot',''],
      [hkDay(),'達 → 香港','top',state.da==='hk'?'':'end']
    ].forEach(function(m){
      h.push('<div class="ms" style="grid-row:'+rowOf('ms')+';grid-column:'+(m[0]+2)+'"><i class="dot"></i><span class="ml '+m[2]+' '+m[3]+'">'+esc(m[1])+'</span></div>');
    });

    runs('me','s',function(x){ return x.s; },function(x){ return x.c; });
    runs('sleep','sleep',function(x){ return place(x.sleep); },function(x){ return x.sleep==='sh' ? '--c-home' : x.sleep==='hk' ? '--c-travel' : '--c-trip'; });
    LEAVE.forEach(function(i){ h.push('<div class="off" style="grid-row:'+rowOf('al')+';grid-column:'+(i+2)+'" title="'+esc(tr('Annual leave','年假')+' '+fmtD(i))+'">'+tr('AL','假')+'</div>'); });

    FAM.forEach(function(p){ p.legs.forEach(function(l){ seg(p.k,l[0],l[1],l[2],p.c,false,l[3]); }); });
    if (state.cal!=='no'){ var cd=ix(Number(state.cal)); seg('cal',cd,cd,tr('Meet','見面'),'--c-cal',true,tr('Calvin works in Shanghai: one free weekday, ','Calvin 在上海上班：平日一天，')+fmtD(cd)); }
    if (state.fr==='yes'){
      seg('fr',0,ix(7),place('hk'),'--c-frankie',false,tr('Frankie is based in Hong Kong from 11.26','Frankie 11.26 起在香港'));
      seg('fr',ix(8),ix(12),tr('Shanghai (optional)','上海（可選）'),'--c-frankie',true,tr('Optional: joins you in Shanghai 12.8–12.12','可選：12.8–12.12 來上海'));
      seg('fr',ix(13),ix(13),place('hk'),'--c-frankie',false,tr('Back in Hong Kong','回香港'));
    } else seg('fr',0,N-1,tr('Hong Kong · base','香港 · 基地'),'--c-frankie',false,tr('Frankie is based in Hong Kong from 11.26 to 1.9','Frankie 11.26 至 1.9 在香港'));
    seg('keat',ix(12),ix(13),tr('HK from 12.12','12.12 起在香港'),'--c-keat',true,tr('Keat visits Hong Kong 12.12–12.18','Keat 12.12–12.18 來香港'));

    tl.innerHTML = h.join('');
  }

          : tr('Calvin works, so only one weekday. Pencilled in for '+fmtD(ix(Number(state.cal)))+'. Confirm with Calvin.','Calvin 要上班，平日只有一天。暫定 '+fmtD(ix(Number(state.cal)))+'，記得和 Calvin 確認。')},
      {c:'check',l:tr('Check','核對'),h:tr('姨媽\'s race day','姨媽的跑馬日'),
        p:tr('Her start time and expected finish, a cheering spot and a meeting point. Plan the birthday dinner around how she feels afterwards.','她的起跑和預計完賽時間、打氣地點和會合點。生日晚餐看她跑完後的狀態再安排。')},
      {c:'open',l:OPEN,h:tr('Where you sleep in Shanghai','在上海住哪裡'),
        p:tr('With the family, or a hotel. You arrive at Hongqiao late, and Hongqiao station is also where the Suzhou, Hangzhou and Wuhan trains leave from.','跟家人住，或住酒店。你深夜到虹桥，而去苏州、杭州、武汉的高鐵也從虹桥站出發。')}
    );
    document.getElementById('dec').innerHTML = decs.map(function(x){
      return '<li><div class="h"><span class="chip '+x.c+'">'+esc(x.l)+'</span>'+esc(x.h)+'</div><p>'+esc(x.p)+'</p></li>';
    }).join('');

    var inPlan = ['suzhou','zhujiajiao'].concat(state.da==='sh' ? ['hangzhou','nanjing'] : []);
    var opts = [
      ['suzhou',tr('苏州 Suzhou','苏州'),tr('~30 min','約 30 分鐘'),tr('Gardens, canals and noodles. The easy choice for 12.8 with the family.','園林、運河和麵。12.8 和家人去最輕鬆。')],
      ['zhujiajiao',tr('朱家角 Zhujiajiao','朱家角'),tr('~1 h metro','地鐵約 1 小時'),tr('The closest water town. No train to book.','最近的水鄉，不用訂火車票。')],
      ['hangzhou',tr('杭州 Hangzhou','杭州'),tr('~45–60 min','約 45–60 分鐘'),tr('West Lake, temples and tea villages. Best with one night.','西湖、寺廟和茶村，最好住一晚。')],
      ['nanjing',tr('南京 Nanjing','南京'),tr('~1–1.5 h','約 1–1.5 小時'),tr('History and museums, duck and snacks.','歷史、博物館、鴨子和小吃。')],
      ['towns',tr('乌镇 / 西塘 Wuzhen / Xitang','乌镇 / 西塘'),tr('~1.5–2 h','約 1.5–2 小時'),tr('Canal towns. Wuzhen is at its best at night, so stay over.','水鄉古鎮。乌镇夜景最美，值得住一晚。')]
    ];
    var onLabel = tr('in your plan','已在計劃中');
    document.getElementById('opts').innerHTML = opts.map(function(o){
      return '<li'+(inPlan.indexOf(o[0])>-1?' class="on"':'')+'><b data-on="'+esc(onLabel)+'">'+esc(o[1])+'</b><span class="tm">'+esc(o[2])+'</span><p>'+esc(o[3])+'</p></li>';
    }).join('');

    var know = [
      [tr('Late arrival:','深夜抵達：'),tr('CZ3596 lands at Hongqiao 虹桥 at 22:10. Plan on a taxi or DiDi to wherever you\'re staying, and nothing else that night.','CZ3596 22:10 抵達虹桥。坐的士或 DiDi 直接去住處，當晚不要安排其他事。')],
      [tr('Weather:','天氣：'),tr('Shanghai is about 4–12 °C in early December, damp and often grey. Wuhan is similar or a little colder. Older buildings are poorly heated, so pack layers and a waterproof, plus something warm for standing out at the race.',
                               '上海 12 月初約 4–12 °C，潮濕多陰天；武汉差不多或更冷一點。老房子暖氣不足，帶多層衣服和防水外套，還有在跑馬場邊站著打氣時保暖的衣物。')],
      [tr('Internet:','上網：'),tr('Google and WhatsApp are blocked on the mainland. Set up a roaming eSIM or VPN before 12.5.','內地封鎖 Google 和 WhatsApp。12.5 前設定好漫遊 eSIM 或 VPN。')],
      [tr('Paying:','付款：'),tr('Link Alipay or WeChat Pay to a foreign card, and add DiDi for taxis. Carry a little cash.','把支付寶或微信支付綁定海外信用卡，再裝 DiDi 叫車。帶少量現金。')],
      [tr('Trains:','火車：'),tr('Book on 12306 or Trip.com. Your passport is the ticket, and sales open about 15 days ahead. The Wuhan → Hong Kong train clears immigration at West Kowloon 西九龍.','在 12306 或 Trip.com 訂票，護照就是車票，約提前 15 天開售。武汉到香港的高鐵在西九龍過關。')]
    ];
    document.getElementById('know').innerHTML = know.map(function(k){ return '<li><b>'+esc(k[0])+'</b> '+esc(k[1])+'</li>'; }).join('');
  }

  function renderChecks(){
    var list = [
      ['flt-in',tr('Flight in: CZ3596 → Hongqiao 22:10','去程：CZ3596 → 虹桥 22:10'),tr('booked','已訂'),true],
      ['race',tr('姨媽\'s race: start time, cheering spot','姨媽跑馬：起跑時間、打氣地點'),'12.6'],
      ['gift',tr('Birthday gift for 姨媽','姨媽的生日禮物'),tr('by 12.6','12.6 前')],
      ['stay',tr('Shanghai: with family or a hotel','上海住宿：跟家人或酒店'), state.da==='sh' ? '12.5–12.12' : '12.5–12.8']
    ];
    if (state.cal!=='no') list.push(['calvin',tr('Confirm the day with Calvin 曾致','和 Calvin（曾致）確認日子'),'12.'+state.cal]);
    list.push(['sz',tr('Suzhou trains, or Zhujiajiao by metro','苏州火車票，或坐地鐵去朱家角'),'12.8']);
    if (state.da==='wuhan') list.push(
      ['wh-train',tr('Train Shanghai → Wuhan','上海 → 武汉 火車'),'12.9'],
      ['wh-stay',tr('Wuhan hotel, with the family','武汉酒店（與家人）'),'12.9–12.12'],
      ['to-hk',tr('Train Wuhan → Hong Kong West Kowloon','武汉 → 香港西九龍 火車'),'12.13']);
    else if (state.da==='sh') list.push(
      ['hz',tr('Hangzhou hotel and trains','杭州酒店和火車'),'12.9–12.10'],
      ['to-hk',tr('Flight Shanghai → Hong Kong','上海 → 香港 機票'),'12.13']);
    else list.push(
      ['to-hk',tr('Flight Shanghai → Hong Kong','上海 → 香港 機票'),'12.9'],
      ['hk-early',tr('Hong Kong stay from 12.9','12.9 起香港住宿'),'12.9 →']);
    list.push(
      ['entry',tr('Entry rules for your passport','護照入境規定'),tr('before Dec','12月前')],
      ['esim',tr('eSIM / VPN for mainland China','內地用 eSIM / VPN'),tr('before 12.5','12.5 前')],
      ['pay',tr('Alipay / WeChat Pay and DiDi','支付寶／微信支付和 DiDi'),tr('before 12.5','12.5 前')]);
    var done={};
    try{ done=JSON.parse(localStorage.getItem('sh-checks')||'{}')||{}; }catch(e){}
    document.getElementById('check').innerHTML = list.map(function(x){
      return '<li><label for="ck-'+x[0]+'"><input type="checkbox" id="ck-'+x[0]+'" data-id="'+x[0]+'"'+(done[x[0]]||x[3]?' checked':'')+(x[3]?' disabled':'')+'><span class="what">'+esc(x[1])+'</span><span class="when">'+esc(x[2])+'</span></label></li>';
    }).join('');
  }

  function applyLang(){
    document.documentElement.lang = L==='zh' ? 'zh-Hant' : 'en';
    document.querySelectorAll('[data-en]').forEach(function(el){ el.textContent = el.getAttribute('data-'+L); });
  }
  function syncToggles(){
    document.querySelectorAll('.seggrp').forEach(function(g){
      var k=g.getAttribute('data-k'), cur = k==='lang' ? L : state[k];
      g.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(cur===b.getAttribute('data-v'))); });
    });
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('.seggrp button'); if(!b) return;
    var k=b.parentNode.getAttribute('data-k'), v=b.getAttribute('data-v');
    if (k==='lang'){ L=v; try{ localStorage.setItem('wt-lang',L); }catch(err){} }
    else { state[k]=v; save(); }
    renderAll();
  });
  document.addEventListener('change',function(e){
    if(!e.target.matches('.check input')) return;
    var done={};
    try{ done=JSON.parse(localStorage.getItem('sh-checks')||'{}')||{}; }catch(err){}
    done[e.target.getAttribute('data-id')]=e.target.checked;
    try{ localStorage.setItem('sh-checks',JSON.stringify(done)); }catch(err){}
  });

  function renderAll(){ var d=plan(); applyLang(); renderTimeline(d); renderText(d); renderChecks(); syncToggles(); }
  renderAll();
})();
</script>
