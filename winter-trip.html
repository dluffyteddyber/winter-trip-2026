<title>Winter 2026 Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-width swimlane timeline (who is where, each day) leads and fits the screen on desktop; a date editor sits under it; itinerary, decisions and logistics follow in a two-column grid that stacks on phones. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18212D; --muted:#5A6573; --line:#D5DBE2;
  --accent:#C2362B;
  --c-me:#C2362B; --c-family:#7B4B8E; --c-family2:#5257A3; --c-family3:#2F7397; --c-cal:#6B7A1E; --c-thai:#A34A1C; --c-hong:#B2456E; --c-frankie:#1E7A70; --c-keat:#B4761A; --c-work:#3C5A8A; --c-travel:#18212D; --c-ok:#1E7A70;
  --weekend:rgba(60,90,138,.07);
  --f-display:"Familjen Grotesk","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","PingFang TC","Microsoft JhengHei",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --surface:#161D27; --ink:#E5E9EF; --muted:#98A3B2; --line:#2A3443;
    --accent:#EA5A4E;
    --c-me:#EA5A4E; --c-family:#B98CCB; --c-family2:#9DA1E6; --c-family3:#7BB8D9; --c-cal:#B5C55A; --c-thai:#E8996A; --c-hong:#E07AA0; --c-frankie:#4DB5A9; --c-keat:#E3A748; --c-work:#7D9BCC; --c-travel:#E5E9EF; --c-ok:#4DB5A9;
    --weekend:rgba(125,155,204,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --ink:#E5E9EF; --muted:#98A3B2; --line:#2A3443;
  --accent:#EA5A4E;
  --c-me:#EA5A4E; --c-family:#B98CCB; --c-family2:#9DA1E6; --c-family3:#7BB8D9; --c-cal:#B5C55A; --c-thai:#E8996A; --c-hong:#E07AA0; --c-frankie:#4DB5A9; --c-keat:#E3A748; --c-work:#7D9BCC; --c-travel:#E5E9EF; --c-ok:#4DB5A9;
  --weekend:rgba(125,155,204,.07);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1360px;margin:0 auto;padding-block:36px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:start}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5.2vw,46px);line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:10px 32px;margin:18px 0 0;padding:0}
.facts div{display:grid;gap:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px}
.ctrl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seggrp{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seggrp button{font:500 13px var(--f-mono);background:transparent;color:var(--ink);border:0;padding:5px 10px;cursor:pointer}
.seggrp button+button{border-left:1px solid var(--line)}
.seggrp button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tl-scroll{overflow-x:auto}
.tl{display:grid;grid-template-columns:104px repeat(45,minmax(0,1fr));position:relative}
@media (max-width:820px){.tl{grid-template-columns:88px repeat(45,26px);min-width:max-content}}
.col{z-index:0}
.col.we{background:var(--weekend)}
.col.mon{border-left:1px solid var(--line)}
.mo{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);padding-left:4px;z-index:1;align-self:end;white-space:nowrap;overflow:hidden}
.dn,.dw{font-family:var(--f-mono);font-size:12px;text-align:center;z-index:1;font-variant-numeric:tabular-nums;align-self:center}
.dw{font-size:11px;color:var(--muted)}
.dn.we,.dw.we{color:var(--c-work)}
.lab{position:sticky;left:0;z-index:4;background:var(--surface);display:flex;flex-direction:column;justify-content:center;padding-right:8px;border-right:1px solid var(--line);font-size:13px;font-weight:600;line-height:1.2;min-width:0}
.lab small{font-weight:400;color:var(--muted);font-size:11px}
.seg{--c:var(--ink);--fill:color-mix(in srgb,var(--c) 17%,var(--surface));--fill2:color-mix(in srgb,var(--c) 6%,var(--surface));
  margin:5px 1px;border-radius:5px;background:var(--fill);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  font-size:12px;font-weight:500;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;z-index:1;min-width:0}
.seg span{overflow:hidden;text-overflow:ellipsis}
.seg.one{padding:0;justify-content:center;font-family:var(--f-mono);font-size:11px}
.seg.tent{background:repeating-linear-gradient(135deg,var(--fill) 0 6px,var(--fill2) 6px 11px);border-style:dashed}
.off.ph{color:var(--c-work);border-color:color-mix(in srgb,var(--c-work) 55%,transparent);background:color-mix(in srgb,var(--c-work) 12%,var(--surface))}
.off{z-index:1;margin:9px 2px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);min-width:0;overflow:hidden}
.ms{position:relative;z-index:2;min-width:0}
.ms .dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.ms .ml{position:absolute;left:calc(50% - 4px);font-size:12px;font-weight:600;white-space:nowrap;line-height:1}
.ms .ml.top{top:2px}.ms .ml.bot{bottom:2px}
.ms .ml.end{left:auto;right:calc(50% - 4px)}
.ms::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted)}
.legend > span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:12px;border-radius:3px;border:1px solid var(--muted);background:color-mix(in srgb,var(--muted) 18%,var(--surface))}
.sw.tent{border-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 22%,var(--surface)) 0 4px,var(--surface) 4px 7px)}

.alert{--c:var(--accent);display:grid;gap:4px;padding:12px 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 8%,var(--surface));font-size:14px}
.alert.ok{--c:var(--c-ok)}
.alert b{color:var(--c);font-weight:600}
.together{display:flex;flex-wrap:wrap;gap:8px}
.together span{--c:var(--ink);font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.together b{font-family:var(--f-mono);font-weight:500}

.edhead{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:end;justify-content:space-between}
.edhead p{margin:4px 0 0;font-size:13px;color:var(--muted);max-width:62ch}
.reset{font:500 13px var(--f-body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
.reset:hover{background:var(--bg)}
.editor{display:grid}
.er{display:grid;grid-template-columns:110px 170px minmax(0,1fr) 170px 160px;gap:6px 14px;align-items:center;padding:5px 0}
.er.first{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.er.hd{font-size:12px;color:var(--muted);padding-bottom:2px}
.ew{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.ew i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.el{min-width:0}
.ed{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.stp .st{width:30px;height:28px;border:0;background:transparent;color:var(--ink);cursor:pointer;font:500 15px/1 var(--f-mono)}
.stp .st:hover{background:var(--bg)}
.stp .v{min-width:76px;text-align:center;font:13px var(--f-mono);padding:0 6px;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:28px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fixed{font-size:12px;color:var(--muted)}
.tog{font:500 12px var(--f-body);border:1px dashed var(--line);border-radius:999px;padding:3px 10px;background:transparent;color:var(--muted);cursor:pointer;text-align:left}
.tog[aria-pressed="true"]{border-style:solid;border-color:var(--tc,var(--c-frankie));color:var(--ink);background:color-mix(in srgb,var(--tc,var(--c-frankie)) 14%,var(--surface))}
@media (max-width:700px){
  .er{grid-template-columns:76px minmax(0,1fr);gap:4px 10px}
  .er .ew{grid-row:span 4;align-self:start}
  .er.hd{display:none}
  .er > div:empty{display:none}
}

.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:28px;min-width:0}
section{display:grid;gap:14px;min-width:0}

.itin{list-style:none;margin:0;padding:0;display:grid}
.itin li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.itin li:last-child{border-bottom:1px solid var(--line)}
.itin .d{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:1px}
.itin .t{font-weight:600}
.itin .n{color:var(--muted);font-size:14px}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ideas span{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.ideas em{font-style:normal;font-family:var(--f-mono);color:var(--muted)}
@media (max-width:480px){.itin li{grid-template-columns:minmax(0,1fr);gap:2px}}

.dec{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dec li{display:grid;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.dec .h{display:flex;gap:8px;align-items:center;font-weight:600}
.chip{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;border:1px solid currentColor;flex:none}
.chip.clash{color:var(--accent)}
.chip.open{color:var(--c-keat)}
.chip.check{color:var(--c-work)}
.dec p{margin:0;color:var(--muted);font-size:14px}

.tz{display:grid;gap:6px}
.tzbar{display:grid;grid-template-columns:repeat(48,1fr);height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.tzbar i{display:block}
.tzbar .w{background:color-mix(in srgb,var(--c-work) 55%,var(--surface))}
.tzbar .f{background:color-mix(in srgb,var(--c-keat) 30%,var(--surface))}
.tzbar .s{background:var(--bg)}
.tzax{display:flex;justify-content:space-between;font:12px var(--f-mono);color:var(--muted)}
.tzkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.tzkey > span{display:inline-flex;gap:6px;align-items:center}
.tzkey i{width:12px;height:12px;border-radius:3px;display:inline-block}

.check{list-style:none;margin:0;padding:0;display:grid}
.check li{border-top:1px solid var(--line)}
.check label{display:flex;gap:10px;align-items:baseline;padding:8px 0;cursor:pointer;font-size:14px}
.check input{accent-color:var(--accent);transform:translateY(2px)}
.check .when{margin-left:auto;font:12px var(--f-mono);color:var(--muted);white-space:nowrap;padding-left:8px}
.check input:checked ~ .what{color:var(--muted);text-decoration:line-through}
.note{font-size:13px;color:var(--muted);margin:0}
.lanechips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lc-label{font-size:12px;color:var(--muted);margin-right:4px}
.lanechip{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-body);padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--ink);cursor:pointer}
.lanechip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lanechip[aria-pressed="false"]{background:transparent;border-color:var(--line);color:var(--muted);text-decoration:line-through}
.lanechip[aria-pressed="false"] i{background:transparent;border:1px solid var(--muted)}
.lanechip.all{border-style:dashed;border-color:var(--line);background:transparent}
.rm{margin-left:8px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font:14px/1 var(--f-body)}
.rm:hover{color:var(--accent);border-color:var(--accent)}
.names{border-top:1px solid var(--line);padding-top:14px}
.names summary{cursor:pointer;font:600 15px var(--f-display)}
.nm-grid{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,200px) minmax(0,200px);gap:6px 12px;align-items:center;margin:12px 0 8px}
.nm-grid .hd{font-size:12px;color:var(--muted)}
.nm-who{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.nm-who i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.nm-grid input{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 9px;min-width:0;width:100%}
.addform{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.addform h3{margin:0;font:600 15px var(--f-display)}
.af-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.af-row label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.af-row input,.af-row select{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-width:0}
#af-name,#af-place{width:170px}
#af-len{width:80px}
.subtrips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.subtrips a{display:grid;gap:2px;min-width:220px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none}
.subtrips a:hover{border-color:var(--accent)}
.subtrips .k{font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.subtrips b{font-weight:600}
.subtrips .go,.sublink{font-size:13px;color:var(--accent)}
.sublink{font-weight:500;margin-left:8px;text-decoration:none}
.sublink:hover,.subtrips a:hover .go{text-decoration:underline}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <div class="eyebrow" data-en="Shanghai · Wuhan? · Hong Kong · China trip · Hong Kong → London" data-zh="上海 · 武汉? · 香港 · 中國遊 · 香港 → 倫敦"></div>
      <div class="seggrp" data-k="lang" aria-label="Language 語言"><button type="button" data-v="en" lang="en">EN</button><button type="button" data-v="zh" lang="zh-Hant">中文</button></div>
    </div>
    <h1 data-en="Winter Trip 2026–27" data-zh="冬日行程 2026–27"></h1>
    <dl class="facts">
      <div><dt data-en="Dates" data-zh="日期"></dt><dd data-en="Sat 5 Dec – Sat 16 Jan" data-zh="12.5 週六 – 1.16 週六"></dd></div>
      <div><dt data-en="Nights away" data-zh="在外晚數"></dt><dd data-en="42" data-zh="42 晚"></dd></div>
      <div><dt data-en="Remote work" data-zh="遠程工作"></dt><dd id="f-work"></dd></div>
      <div><dt data-en="Annual leave" data-zh="年假"></dt><dd id="f-off"></dd></div>
      <div><dt data-en="Public holidays" data-zh="公眾假期"></dt><dd id="f-ph"></dd></div>
      <div><dt data-en="Family" data-zh="家人"></dt><dd id="f-family"></dd></div>
      <div><dt data-en="Friends" data-zh="朋友"></dt><dd id="f-friends"></dd></div>
      <div><dt data-en="Flights" data-zh="航班"></dt><dd data-en="CZ3596 in · CX237 home" data-zh="CZ3596 去 · CX237 回"></dd></div>
    </dl>
    <nav class="subtrips" aria-label="Sub-trips">
      <a data-sub="sh" target="_blank" rel="noopener"><span class="k" data-en="Sub-trip · Shanghai" data-zh="分行程 · 上海"></span><b data-en="上海 Shanghai · 12.5 – 12.13" data-zh="上海 · 12.5 – 12.13"></b><span class="go" data-en="Open plan →" data-zh="打開計劃 →"></span></a>
      <a data-sub="cn" target="_blank" rel="noopener"><span class="k" data-en="Sub-trip · China trip" data-zh="分行程 · 中國遊"></span><b data-en="雲南 Yunnan · 12.25 – 1.3" data-zh="雲南 · 12.25 – 1.3"></b><span class="go" data-en="Open plan →" data-zh="打開計劃 →"></span></a>
    </nav>
  </header>

  <div class="panel">
    <div class="panel-head">
      <h2 data-en="Who's where, day by day" data-zh="每日行蹤"></h2>
      <div class="controls">
        <div class="ctrl"><span id="ctrl-da"></span>
          <div class="seggrp" data-k="da"><button type="button" data-v="wuhan" data-en="Wuhan" data-zh="去武汉"></button><button type="button" data-v="hk" data-en="HK first" data-zh="先去香港"></button><button type="button" data-v="sh" data-en="Stay in SH" data-zh="留上海"></button></div>
        </div>
      </div>
    </div>
    <div class="lanechips" id="lanechips"></div>
    <div class="tl-scroll"><div class="tl" id="tl"></div></div>
    <div class="legend">
      <span><i class="sw"></i><span data-en="Confirmed" data-zh="已確定"></span></span>
      <span><i class="sw tent"></i><span data-en="Tentative / to decide" data-zh="暫定／待決定"></span></span>
      <span><i class="sw" style="background:var(--weekend);border-color:var(--line)"></i><span data-en="Weekend" data-zh="週末"></span></span>
      <span><i class="off" style="margin:0;width:22px;height:14px" data-en="AL" data-zh="假"></i><span data-en="Annual leave" data-zh="年假"></span></span>
      <span><i class="off ph" style="margin:0;width:22px;height:14px" data-en="PH" data-zh="公"></i><span data-en="Public holiday" data-zh="公眾假期"></span></span>
      <span data-en="Hover a bar for flight details" data-zh="滑鼠移到色條上可看航班詳情"></span>
    </div>
    <div class="alert" id="clash"></div>
    <div class="together" id="together"></div>
  </div>

  <div class="panel">
    <div class="edhead">
      <div>
        <h2 data-en="Adjust dates" data-zh="調整日期"></h2>
        <p data-en="Use ‹ › to move when someone arrives and − + to change how long each stay lasts. Later stays move with it. Changes are saved in this browser." data-zh="用 ‹ › 移動抵達日，用 − + 改變每段停留的天數，之後的行程會跟著移動。更改會儲存在這個瀏覽器。"></p>
      </div>
      <button type="button" class="reset" id="reset" data-en="Reset to plan" data-zh="還原計劃"></button>
    </div>
    <div class="editor" id="editor"></div>
    <details class="names" id="names">
      <summary data-en="Edit names" data-zh="編輯名字"></summary>
      <div class="nm-grid" id="nmgrid"></div>
      <p class="note" data-en="Each person has an English and a Chinese name. Leave a box empty to use the default shown in grey. Names are saved in this browser." data-zh="每個人有英文和中文名字。留空就用灰色的預設名字。名字儲存在這個瀏覽器。"></p>
    </details>
    <form class="addform" id="addform" autocomplete="off">
      <h3 data-en="Add a person or a stay" data-zh="新增人物或行程"></h3>
      <div class="af-row">
        <label for="af-name"><span data-en="Name" data-zh="名字"></span><input id="af-name" list="af-names" maxlength="40" data-ph-en="e.g. Alex" data-ph-zh="例如 Alex"></label>
        <datalist id="af-names"></datalist>
        <label for="af-place"><span data-en="Where" data-zh="地點"></span><input id="af-place" maxlength="40" data-ph-en="e.g. Hong Kong" data-ph-zh="例如 香港"></label>
        <label for="af-start"><span data-en="Arrives" data-zh="抵達"></span><select id="af-start"></select></label>
        <label for="af-len"><span data-en="Days" data-zh="天數"></span><input id="af-len" type="number" min="1" max="45" value="3"></label>
        <button type="submit" class="reset" data-en="Add" data-zh="新增"></button>
      </div>
      <p class="note" id="af-msg" role="status"></p>
      <p class="note" data-en="Type a name you already added to give that person another stay. Added people are saved in this browser." data-zh="輸入已新增的名字，可以為那個人再加一段行程。新增的人儲存在這個瀏覽器。"></p>
    </form>
  </div>

  <div class="grid2">
    <section>
      <h2 data-en="Itinerary" data-zh="行程"></h2>
      <ol class="itin" id="itin"></ol>
    </section>

    <div class="stack">
      <section>
        <h2 data-en="Decide next" data-zh="待決定"></h2>
        <ul class="dec" id="dec"></ul>
      </section>

      <section>
        <h2 data-en="Your working day from China / HK" data-zh="在中國／香港的工作時間"></h2>
        <div class="tz">
          <div class="tzbar" id="tzbar" aria-label="24h"></div>
          <div class="tzax"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
          <div class="tzkey">
            <span><i style="background:color-mix(in srgb,var(--c-keat) 30%,var(--surface))"></i><span data-en="Free for sightseeing 08:00–16:00" data-zh="自由活動 08:00–16:00"></span></span>
            <span><i style="background:color-mix(in srgb,var(--c-work) 55%,var(--surface))"></i><span data-en="London 09:00–17:30 = 17:00–01:30" data-zh="倫敦 09:00–17:30 = 當地 17:00–01:30"></span></span>
          </div>
          <p class="note" data-en="UK is on GMT in winter, 8 hours behind Shanghai, Yunnan and Hong Kong. Your days are free and your evenings belong to work." data-zh="英國冬天用格林威治時間，比上海、雲南和香港慢 8 小時。白天自由，晚上工作。"></p>
        </div>
      </section>

      <section>
        <h2 data-en="Bookings" data-zh="預訂"></h2>
        <ul class="check" id="check"></ul>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
  var START = Date.UTC(2026,11,3), N = 45;
  function ix(m,d){ return Math.round((Date.UTC(m===1?2027:2026,m-1,d)-START)/864e5); }
  function day(i){ return new Date(START+i*864e5); }

  var L = 'en';
  try{ L = localStorage.getItem('wt-lang') || ((navigator.language||'').toLowerCase().indexOf('zh')===0 ? 'zh' : 'en'); }catch(e){}
  if (location.hash==='#zh' || location.hash==='#en') L = location.hash.slice(1);
  if (L!=='zh') L='en';
  function tr(en,zh){ return L==='zh' ? zh : en; }

  // Sub-trip pages: the local file when opened from the folder, the published page online.
  var SUB = {sh:['Shanghai%20Subtrip/shanghai-subtrip.html','https://claude.ai/artifact/2E6SUdUdGXHNQkU5mnFTXE'],
             cn:['China%20Sub-trip/index.html','https://claude.ai/artifact/DY4Ty75F4qNxR89s2g4jRv']};
  function subHref(k){ return SUB[k][location.protocol==='file:' ? 0 : 1]; }
  document.querySelectorAll('[data-sub]').forEach(function(a){ a.href=subHref(a.getAttribute('data-sub')); });

  var WK_ZH = ['日','一','二','三','四','五','六'], WK_EN = ['S','M','T','W','T','F','S'], WKD_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function fmt(i){ var d=day(i); return (d.getUTCMonth()+1)+'.'+d.getUTCDate(); }
  function fmtD(i){ var w=day(i).getUTCDay(); return fmt(i)+' '+tr(WKD_EN[w],'週'+WK_ZH[w]); }
  function range(a,b){ return a>=b ? fmt(a) : fmt(a)+' – '+fmt(b); }
  function days(n){ return tr(n+' d', n+' 天'); }
  function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  // Days off: 12.24, 12.25, 12.28 and 1.1 assumed; 12.29–12.31 confirmed off.
  var PH = [ix(12,25),ix(12,28),ix(1,1)];    // public holidays
  function phName(i){
    return i===ix(12,25) ? tr('Christmas Day','聖誕節')
         : i===ix(12,28) ? tr('Boxing Day (substitute day)','節禮日（補假）')
         : tr('New Year\'s Day','元旦');
  }
  var AL = [ix(12,29),ix(12,30),ix(12,31)];  // annual leave during remote work
  var HOL = PH.concat(AL);
  // Annual leave before remote work starts: weekdays 12.7–12.11 (12.4 is not needed).
  var LEAVE = [];
  for (var q=ix(12,7); q<=ix(12,11); q++){ var wd=day(q).getUTCDay(); if (wd>0 && wd<6) LEAVE.push(q); }
  var W0 = ix(12,14), W1 = ix(1,15), LAND = ix(12,5), HOME = ix(1,16);

  // Everyone except you: an arrival day and a chain of stays. Leg = [en label, zh label, en tip, zh tip].
  var PEOPLE = [
    {id:'ming', name:'小明', sub:['Family','家人'], c:'--c-family', legs:[
      ['Shanghai','上海','UA857 lands PVG 18:34 on arrival day','UA857 18:34 抵達浦東'],
      ['Wuhan','武汉','With 亮 and 许嵩','與亮、许嵩同行'],
      ['Hong Kong','香港','UA862 leaves HKG 10:35 on the last day','最後一天 UA862 10:35 香港起飛']]},
    {id:'liang', name:'亮', sub:['Family','家人'], c:'--c-family2', legs:[
      ['Shanghai','上海','Lands PVG T2 16:00 on arrival day','16:00 抵達浦東 T2'],
      ['Wuhan','武汉','With 小明 and 许嵩','與小明、许嵩同行'],
      ['Hong Kong · home','香港 · 回家','Back home in Hong Kong','回到香港的家']]},
    {id:'xs', name:'许嵩', sub:['Family','家人'], c:'--c-family3', legs:[
      ['Shanghai','上海','Lands PVG T2 16:00 on arrival day','16:00 抵達浦東 T2'],
      ['Wuhan','武汉','With 小明 and 亮','與小明、亮同行'],
      ['Hong Kong','香港','Back to mainland China on the last day','最後一天回中國內地']]},
    {id:'hong', name:'红', sub:['Family','家人'], c:'--c-hong', legs:[
      ['Shanghai','上海','CZ6543 lands PVG 14:20 · CZ6544 leaves PVG 15:25 on the last day','CZ6543 14:20 抵達浦東 · 最後一天 CZ6544 15:25 浦東起飛']]},
    {id:'keat', name:'Keat', sub:['Friend','朋友'], c:'--c-keat', tent:true, legs:[
      ['Hong Kong','香港','Keat visiting Hong Kong','Keat 來香港']]}
  ];
  // Frankie: optional Shanghai stay, can join your China trip, then Hong Kong.
  var DEF = {da:'wuhan', shLen:4, routeLen:4, chinaStart:ix(12,25), chinaLen:10,
    p:{ming:{start:ix(12,3),lens:[6,4,4]}, liang:{start:ix(12,3),lens:[6,4,35]}, xs:{start:ix(12,3),lens:[6,4,4]}, hong:{start:ix(12,5),lens:[5]},
       keat:{start:ix(12,12),lens:[7]}},
    v:2, fr:{sh:true, shStart:ix(12,8), shLen:5, china:true, hkStart:ix(11,26), hkEnd:ix(1,9)},
    cal:{on:true, day:ix(12,7)},  // Calvin (曾致): works in Shanghai, free one weekday
    th:{lot:{on:true,s:0,e:0}, top:{on:true,s:0,e:0}},  // Lot and Top: join the China trip; s/e = days joined late / left early
    custom:[],   // people added on the page: {id, name, stays:[{place, start, len}]}
    hidden:[],   // chart rows switched off
    names:{}};   // edited display names: id → [English, Chinese]
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  var state = clone(DEF);
  try{
    var s = JSON.parse(localStorage.getItem('wt-state2')||'null');
    if (s){
      if (['wuhan','hk','sh'].indexOf(s.da)>-1) state.da=s.da;
      ['shLen','routeLen','chinaStart','chinaLen'].forEach(function(k){ if(Number.isInteger(s[k])) state[k]=s[k]; });
      if (s.p) PEOPLE.forEach(function(p){
        var q=s.p[p.id];
        if (q && Number.isInteger(q.start) && Array.isArray(q.lens) && q.lens.length===p.legs.length && q.lens.every(Number.isInteger)) state.p[p.id]={start:q.start,lens:q.lens.slice()};
      });
      var f=s.fr;
      if (s.v===2 && f && typeof f.sh==='boolean' && typeof f.china==='boolean' && ['shStart','shLen','hkStart','hkEnd'].every(function(k){ return Number.isInteger(f[k]); }))
        state.fr={sh:f.sh,shStart:f.shStart,shLen:f.shLen,china:f.china,hkStart:f.hkStart,hkEnd:f.hkEnd};
      if (s.cal && typeof s.cal.on==='boolean' && Number.isInteger(s.cal.day)) state.cal={on:s.cal.on,day:s.cal.day};
      if (s.th) ['lot','top'].forEach(function(id){
        var t=s.th[id];
        if (t && typeof t.on==='boolean' && Number.isInteger(t.s) && Number.isInteger(t.e)) state.th[id]={on:t.on,s:t.s,e:t.e};
      });
      if (Array.isArray(s.custom)) state.custom = s.custom.filter(function(c){
        return c && typeof c.id==='string' && typeof c.name==='string' && Array.isArray(c.stays) &&
          c.stays.every(function(x){ return x && typeof x.place==='string' && Number.isInteger(x.start) && Number.isInteger(x.len); });
      }).map(function(c){ return {id:c.id, name:c.name.slice(0,40), stays:c.stays.map(function(x){ return {place:x.place.slice(0,40), start:x.start, len:x.len}; })}; });
      if (Array.isArray(s.hidden)) state.hidden = s.hidden.filter(function(h){ return typeof h==='string'; });
      if (s.names && typeof s.names==='object') Object.keys(s.names).forEach(function(id){
        var n=s.names[id];
        if (Array.isArray(n) && n.length===2 && typeof n[0]==='string' && typeof n[1]==='string') state.names[id]=[n[0].slice(0,40),n[1].slice(0,40)];
      });
    }
  }catch(e){}

  // Display names: [English, Chinese]. An empty edit falls back to the default.
  var NAME_DEF = {me:['Da','達'], ming:['Ming','小明'], liang:['亮','亮'], xs:['许嵩','许嵩'], hong:['红','红'],
                  keat:['Keat','Keat'], cal:['Calvin','Calvin'], frankie:['Frankie','Frankie'], lot:['Lot','Lot'], top:['Top','Top']};
  function nmDefault(id,k){
    if (NAME_DEF[id]) return NAME_DEF[id][k];
    var c=state.custom.filter(function(x){ return x.id===id; })[0];
    return c ? c.name : id;
  }
  function nm(id){ var k=L==='zh'?1:0, n=state.names[id]; return (n && n[k]) || nmDefault(id,k); }
  var CPAL = ['--c-keat','--c-frankie','--c-hong','--c-family2','--c-cal','--c-thai','--c-family3'];
  function customColor(k){ return CPAL[k % CPAL.length]; }
  function save(){ try{ localStorage.setItem('wt-state2',JSON.stringify(state)); }catch(e){} }

  function isWork(i){ var w=day(i).getUTCDay(); return i>=W0 && i<=W1 && w>0 && w<6 && HOL.indexOf(i)<0; }
  function workBetween(a,b){ var n=0; for(var i=a;i<=b;i++) if(isWork(i)) n++; return n; }

  function me(){
    // A stay set to 0 days drops out; with no China trip, Hong Kong runs to the end.
    var shEnd = LAND+state.shLen-1, route=null, hk;
    if (state.da!=='hk'){ hk=shEnd+state.routeLen+1; if (state.routeLen>0) route=[shEnd+1, hk-1]; } else hk=shEnd+1;
    var cs0 = clamp(state.chinaStart, hk, W1), china = state.chinaLen>0;
    var cs = china ? cs0 : W1+1, ce = china ? Math.min(cs0+state.chinaLen-1, W1) : W1;
    return {shEnd:shEnd, route:route, hk:hk, cs:cs, ce:ce, cs0:cs0, china:china};
  }
  function inHK(i,m){ return (i>=m.hk && i<m.cs) || (i>m.ce && i<=HOME); }
  function legs(p){
    var st=state.p[p.id], a=st.start, out=[];
    p.legs.forEach(function(l,k){ var b=a+st.lens[k]-1; out.push({a:a,b:b,label:tr(l[0],l[1]),tip:tr(l[2],l[3])}); a=b+1; });
    return out;
  }
  function byId(id){ return PEOPLE.filter(function(p){return p.id===id;})[0]; }
  function myPlace(i,m){
    if (i>=LAND && i<=m.shEnd) return 'sh';
    if (m.route && i>=m.route[0] && i<=m.route[1]) return state.da==='sh' ? 'sh' : 'wuhan';
    if (i>=m.cs && i<=m.ce) return 'china';
    if (i>=m.hk && i<=HOME) return 'hk';
    return null;
  }
  // Frankie is based in Hong Kong; the optional Shanghai stay and the China trip are cut out of that.
  function frLegs(m){
    var f=state.fr, out=[], shA=f.shStart, shB=f.shStart+f.shLen-1, cur=null;
    function placeAt(i){
      if (f.sh && i>=shA && i<=shB) return 'sh';
      if (f.china && i>=m.cs && i<=m.ce) return 'china';
      if (i>=f.hkStart && i<=f.hkEnd) return 'hk';
      return null;
    }
    var lo=Math.min(f.hkStart, f.sh?shA:Infinity, f.china?m.cs:Infinity), hi=Math.max(f.hkEnd, f.sh?shB:-Infinity, f.china?m.ce:-Infinity);
    for (var i=lo;i<=hi+1;i++){
      var p = i<=hi ? placeAt(i) : null;
      if (cur && p===cur.place){ cur.b=i; continue; }
      if (cur) out.push(cur);
      cur = p ? {k:p,place:p,a:i,b:i} : null;
    }
    var LBL={sh:tr('Shanghai (optional)','上海（可選）'),china:tr('China trip','中國遊'),hk:tr('Hong Kong','香港')};
    var TIP={sh:tr('Optional: joins you in Shanghai','可選：來上海一起玩'),china:tr('Joins your China trip','一起去中國遊'),hk:tr('Frankie in Hong Kong from '+fmt(f.hkStart),'Frankie '+fmt(f.hkStart)+' 起在香港')};
    out.forEach(function(l){ l.label=LBL[l.k]; l.tip=TIP[l.k]; });
    return out;
  }
  // Lot and Top fly in from Thailand for the China trip.
  var THAI = [{id:'lot',name:'Lot'},{id:'top',name:'Top'}];
  function thLeg(id,m){
    var t=state.th[id];
    if (!t.on || !m.china) return null;
    var a=m.cs+Math.min(t.s,m.ce-m.cs);
    return {a:a, b:Math.max(m.ce-t.e,a)};
  }
  function chinaCrew(m){
    var crew=[];
    if (state.fr.china && m.china) crew.push(nm('frankie'));
    THAI.forEach(function(p){ if (thLeg(p.id,m)) crew.push(nm(p.id)); });
    return crew;
  }
  function together(L,m){
    var n=0, t=0;
    L.forEach(function(l){ for(var i=Math.max(l.a,LAND);i<=l.b;i++){ t++; if (myPlace(i,m)===l.place) n++; } });
    return [n,t];
  }
  function routeName(){ return state.da==='wuhan' ? tr('Wuhan','武汉') : tr('Day trips','周边遊'); }
  var CHINA = function(){ return tr('China trip · Yunnan?','中國遊 · 雲南?'); };

  function renderTimeline(m){
    var all = [{k:'ms',name:tr('Moments','時刻'),sub:'',h:54},{k:'me',name:nm('me'),sub:tr('Me','我'),h:36,c:'--c-me'}]
      .concat(PEOPLE.map(function(p){ return {k:p.id,name:nm(p.id),sub:tr(p.sub[0],p.sub[1]),h:36,c:p.c}; }))
      .concat([{k:'cal',name:''+nm('cal')+'',sub:'曾致',h:36,c:'--c-cal'},{k:'frankie',name:''+nm('frankie')+'',sub:tr('Friend','朋友'),h:36,c:'--c-frankie'}])
      .concat(THAI.map(function(p){ return {k:p.id,name:nm(p.id),sub:tr('Thai friend','泰國朋友'),h:36,c:'--c-thai'}; }))
      .concat(state.custom.map(function(c,k){ return {k:c.id,name:nm(c.id),sub:tr('Added','新增'),h:36,c:customColor(k)}; }))
      .concat([{k:'work',name:tr('Work','工作'),sub:tr('Remote','遠程'),h:36,c:'--c-work'}]);
    // Show / hide chips, one per row
    document.getElementById('lanechips').innerHTML = '<span class="lc-label">'+tr('Show on chart','顯示')+'</span>'+
      all.filter(function(l){ return l.k!=='ms'; }).map(function(l){
        var on = state.hidden.indexOf(l.k)<0;
        return '<button type="button" class="lanechip" data-lane="'+esc(l.k)+'" aria-pressed="'+on+'" style="--c:var('+l.c+')"><i></i>'+esc(l.name)+'</button>';
      }).join('')+
      (state.hidden.length?'<button type="button" class="lanechip all" data-lane="*">'+tr('Show all','全部顯示')+'</button>':'');
    var lanes = all.filter(function(l){ return l.k==='ms' || state.hidden.indexOf(l.k)<0; });
    var tl = document.getElementById('tl');
    tl.style.gridTemplateRows = '20px 22px 18px ' + lanes.map(function(l){return l.h+'px';}).join(' ');
    var h = [];
    var col = function(a,b){ return 'grid-column:'+(a+2)+' / '+(b+3)+';'; };
    var rowOf = function(k){ return lanes.findIndex(function(l){return l.k===k;})+4; };

    for (var i=0;i<N;i++){
      var w = day(i).getUTCDay(), we = (w===0||w===6);
      h.push('<div class="col'+(we?' we':'')+(w===1?' mon':'')+'" style="grid-row:1 / -1;grid-column:'+(i+2)+'"></div>');
      h.push('<div class="dn'+(we?' we':'')+'" style="grid-row:2;grid-column:'+(i+2)+'">'+day(i).getUTCDate()+'</div>');
      h.push('<div class="dw'+(we?' we':'')+'" style="grid-row:3;grid-column:'+(i+2)+'">'+tr(WK_EN[w],WK_ZH[w])+'</div>');
    }
    h.push('<div class="mo" style="grid-row:1;'+col(0,28)+'">'+tr('DEC 2026','2026年12月')+'</div>');
    h.push('<div class="mo" style="grid-row:1;'+col(29,44)+'">'+tr('JAN 2027','2027年1月')+'</div>');
    h.push('<div class="lab" style="grid-row:1 / 4;grid-column:1"></div>');
    lanes.forEach(function(l,r){
      h.push('<div class="lab" style="grid-row:'+(r+4)+';grid-column:1">'+esc(l.name)+(l.sub?'<small>'+esc(l.sub)+'</small>':'')+'</div>');
    });

    function seg(lane,a,b,text,c,tent,tip){
      a=Math.max(a,0); b=Math.min(b,N-1); if (a>b || rowOf(lane)<4) return;
      h.push('<div class="seg'+(tent?' tent':'')+(a===b?' one':'')+'" style="grid-row:'+rowOf(lane)+';'+col(a,b)+'--c:var('+c+')" title="'+esc(tip||text)+' ('+esc(range(a,b))+')"><span>'+esc(text)+'</span></div>');
    }

    var ming = legs(byId('ming'));
    [
      [ming[0].a,tr('Family lands','家人抵滬'),'top',''],
      [LAND,tr(nm('me')+' lands',nm('me')+'抵滬'),'bot',''],
      [ix(12,6),tr('Birthday','生日+跑馬'),'top',''],
      [ming[ming.length-1].b,tr(''+nm('ming')+' flies',''+nm('ming')+'回美'),'bot',''],
      [ix(12,25),phName(ix(12,25)),'top',''],
      [ix(12,28),tr('Boxing Day','節禮日'),'bot',''],
      [ix(1,1),phName(ix(1,1)),'top',''],
      [HOME,tr('CX237 to London','CX237 回倫敦'),'top','end']
    ].forEach(function(x){
      if (x[0]<0||x[0]>=N) return;
      h.push('<div class="ms" style="grid-row:4;grid-column:'+(x[0]+2)+'"><i class="dot"></i><span class="ml '+x[2]+' '+x[3]+'">'+esc(x[1])+'</span></div>');
    });

    // You
    seg('me',LAND,m.shEnd,tr('Shanghai','上海'),'--c-me',false,tr('CZ3596 lands at Hongqiao 22:10 on 12.5','CZ3596 12.5 22:10 抵達虹橋'));
    if (m.route) seg('me',m.route[0],m.route[1],routeName(),'--c-me',true,state.da==='wuhan'?tr('Wuhan with the family','與家人去武汉'):tr('Day trips around Shanghai','上海周边遊'));
    seg('me',m.hk,m.cs-1,tr('Hong Kong','香港'),'--c-me',false,tr('Hong Kong','香港'));
    seg('me',m.cs,m.ce,CHINA(),'--c-me',false,tr('China trip, tentatively Yunnan','中國遊，暫定雲南'));
    seg('me',m.ce+1,W1,tr('Hong Kong','香港'),'--c-me',false,tr('Hong Kong, last stretch','香港，最後一段'));
    seg('me',HOME,HOME,'✈','--c-travel',false,tr('CX237 HKG 00:25 (night of 1.16) → LHR 07:00 on 1.17','CX237 1.17 凌晨 00:25 香港起飛（即 1.16 深夜）→ 07:00 抵達倫敦'));

    // Everyone else
    PEOPLE.forEach(function(p){

      : '';
    decs.push({c:'open',l:OPEN,h:tr(''+nm('frankie')+'\'s plans',''+nm('frankie')+' 的安排'),
      p:tr(''+nm('frankie')+' is in Hong Kong from '+fmt(f.hkStart)+' to '+fmt(f.hkEnd)+', and can join you in Shanghai from '+fmt(f.shStart)+' (optional) and on the China trip. You are together '+fTog+' of '+nm('frankie')+'\'s '+fLen+' days. Switch each part on or off in Adjust dates.',
           ''+nm('frankie')+' '+fmt(f.hkStart)+' 至 '+fmt(f.hkEnd)+' 在香港，可以 '+fmt(f.shStart)+' 起來上海（可選），也一起去中國遊。'+nm('frankie')+' 的 '+fLen+' 天中你們同在 '+fTog+' 天。在「調整日期」可以開關每一段。')+wuhanNote});
    if (cal.on) decs.push({c:calOk?'open':'clash',l:calOk?OPEN:tr('Clash','衝突'),h:tr('Meeting '+nm('cal')+' (曾致)','和 '+nm('cal')+'（曾致）見面'),
      p:tr(''+nm('cal')+' works, so only one weekday. Pencilled in for '+fmtD(cal.day)+'. '+(calOk?'You are in Shanghai that day.':'You are not in Shanghai that day. Pick a weekday between 12.7 and '+fmt(lastSh)+'.'),
           ''+nm('cal')+' 要上班，平日只有一天。暫定 '+fmtD(cal.day)+'。'+(calOk?'那天你在上海。':'那天你不在上海，請選 12.7 至 '+fmt(lastSh)+' 之間的平日。'))});
    decs.push(
      {c:'check',l:CHECK,h:tr('Is it really 4 weeks?','真的是四週嗎？'),
        p:tr('12.14 to 1.15 is '+total+' weekdays. Minus '+PH.length+' public holidays (Christmas Day 12.25, Boxing Day 12.28, New Year\'s Day 1.1) and '+AL.length+' days of leave (12.29–12.31) that leaves '+net+' working days, about '+(net/5).toFixed(1)+' weeks. Check that against your employer\'s limit for working abroad.',
             '12.14 至 1.15 共 '+total+' 個平日，減去 '+PH.length+' 天公眾假期（聖誕節 12.25、節禮日補假 12.28、元旦 1.1）和 '+AL.length+' 天年假（12.29–12.31）剩 '+net+' 個工作日，約 '+(net/5).toFixed(1)+' 週。請對照公司海外工作的上限。')},
      {c:'open',l:OPEN,h:tr('Remote base','遠程工作基地'),
        p:tr('Hong Kong looks like the natural base: '+nm('liang')+' is home there and your flight leaves from there. Working from mainland China needs a VPN and your employer\'s OK.',
             '香港最合適：'+nm('liang')+'住在那裡，回程航班也從香港出發。在中國內地工作需要 VPN 和公司批准。')},
      {c:'check',l:tr('Note','注意'),h:tr('Flight home leaves at 00:25','回程航班 00:25 起飛'),
        p:tr('CX237 departs 00:25 on 17 Jan, which is the night of Saturday 16 Jan. Don\'t book a hotel for the 16th expecting to fly on the 17th.',
             'CX237 在 1.17 凌晨 00:25 起飛，即 1.16（週六）深夜。不要以為 17 號才走而多訂一晚酒店。')}
    );
    document.getElementById('dec').innerHTML = decs.map(function(d){
      return '<li><div class="h"><span class="chip '+d.c+'">'+esc(d.l)+'</span>'+esc(d.h)+'</div><p>'+esc(d.p)+'</p></li>';
    }).join('');
  }

  function renderChecks(m){
    var BOOKED=tr('booked','已訂');
    var list=[['flt-out',tr('Flight in: CZ3596 → Hongqiao 22:10','去程：CZ3596 → 虹橋 22:10'),BOOKED,true]];
    if (state.da==='wuhan' && m.route) list.push(['route',tr('Shanghai → Wuhan train','上海 → 武汉 火車'),fmt(m.route[0])],['to-hk',tr('Wuhan → Hong Kong train','武汉 → 香港 火車'),fmt(m.hk)]);
    else if (state.da==='sh' && m.route) list.push(['route',tr('Day-trip trains and hotels','周边遊火車和酒店'),range(m.route[0],m.route[1])],['to-hk',tr('Shanghai → Hong Kong flight','上海 → 香港 機票'),fmt(m.hk)]);
    else list.push(['to-hk',tr('Shanghai → Hong Kong flight','上海 → 香港 機票'),fmt(m.hk)]);
    list.push(
      ['hk-stay',tr('Hong Kong place to stay','香港住宿'),range(m.hk,m.cs-1)],
      ['work-ok',tr('Employer approval to work abroad','公司批准海外工作'),tr('before Dec','12月前')],
      ['vpn',tr('VPN and eSIM for mainland China','內地用 VPN 和 eSIM'),tr('before 12.5','12.5 前')]
    );
    if (m.china) list.push(
      ['yn-flt',tr('China trip flights','中國遊機票'),fmt(m.cs)+' / '+fmt(m.ce)],
      ['yn-stay',tr('China trip trains and hotels for '+(chinaCrew(m).length+1)+' people','中國遊火車和酒店（'+(chinaCrew(m).length+1)+' 人）'),range(m.cs,m.ce)],
      ['base2',tr('Hong Kong stay, last stretch','香港住宿（最後一段）'),range(m.ce+1,HOME)]
    );
    list.push(['flt-home',tr('Flight home: CX237 HKG → LHR','回程：CX237 香港 → 倫敦'),BOOKED,true]);
    var done={};
    try{ done=JSON.parse(localStorage.getItem('wt-checks')||'{}')||{}; }catch(e){}
    document.getElementById('check').innerHTML = list.map(function(x){
      return '<li><label for="ck-'+x[0]+'"><input type="checkbox" id="ck-'+x[0]+'" data-id="'+x[0]+'"'+(done[x[0]]||x[3]?' checked':'')+(x[3]?' disabled':'')+'><span class="what">'+esc(x[1])+'</span><span class="when">'+esc(x[2])+'</span></label></li>';
    }).join('');
  }

  function renderTZ(){
    var cells=[];
    for (var i=0;i<48;i++){
      var hr=i/2, cls='s';
      if (hr>=17 || hr<1.5) cls='w';
      else if (hr>=8 && hr<16) cls='f';
      cells.push('<i class="'+cls+'"></i>');
    }
    document.getElementById('tzbar').innerHTML=cells.join('');
  }

  // The name grid is only rebuilt when the people or the language change, so typing is never interrupted.
  var nameSig='';
  function renderNames(){
    var rows=[['me','--c-me']].concat(PEOPLE.map(function(p){ return [p.id,p.c]; }))
      .concat([['keat','--c-keat'],['cal','--c-cal'],['frankie','--c-frankie'],['lot','--c-thai'],['top','--c-thai']])
      .concat(state.custom.map(function(c,k){ return [c.id,customColor(k)]; }));
    rows = rows.filter(function(r,i){ return rows.findIndex(function(q){ return q[0]===r[0]; })===i; });
    var sig = rows.map(function(r){ return r[0]; }).join(',')+'|'+L;
    if (sig===nameSig) return;
    nameSig = sig;
    var h=['<span class="hd"></span><span class="hd">English</span><span class="hd">中文</span>'];
    rows.forEach(function(r){
      var id=r[0], n=state.names[id]||['',''];
      h.push('<span class="nm-who"><i style="--c:var('+r[1]+')"></i>'+esc(nmDefault(id,1))+'</span>');
      [0,1].forEach(function(k){
        h.push('<input id="nm-'+esc(id)+'-'+k+'" data-nm="'+esc(id)+'" data-k="'+k+'" maxlength="40" value="'+esc(n[k])+'" placeholder="'+esc(nmDefault(id,k))+'" aria-label="'+esc(nmDefault(id,1)+' · '+(k?'中文':'English'))+'">');
      });
    });
    document.getElementById('nmgrid').innerHTML=h.join('');
  }

  function applyLang(){
    document.documentElement.lang = L==='zh' ? 'zh-Hant' : 'en';
    document.querySelectorAll('[data-en]').forEach(function(el){ el.textContent = el.getAttribute('data-'+L); });
    document.querySelectorAll('[data-ph-en]').forEach(function(el){ el.placeholder = el.getAttribute('data-ph-'+L); });
    var sel=document.getElementById('af-start'), cur=sel.value || String(ix(12,13)), opts=[];
    for (var i=0;i<N;i++) opts.push('<option value="'+i+'">'+esc(fmtD(i))+'</option>');
    sel.innerHTML=opts.join(''); sel.value=cur;
  }
  function syncToggles(){
    document.querySelectorAll('.seggrp').forEach(function(g){
      var k=g.getAttribute('data-k'), cur = k==='lang' ? L : state[k];
      g.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(String(cur)===b.getAttribute('data-v'))); });
    });
  }

  document.addEventListener('click',function(e){
    var g=e.target.closest('.seggrp button');
    if (g){
      var k=g.parentNode.getAttribute('data-k'), v=g.getAttribute('data-v');
      if (k==='lang'){ L=v; try{ localStorage.setItem('wt-lang',L); }catch(err){} }
      else { state[k]=v; save(); }
      renderAll(); return;
    }
    var chip=e.target.closest('.lanechip');
    if (chip){
      var ln=chip.getAttribute('data-lane');
      if (ln==='*') state.hidden=[];
      else if (state.hidden.indexOf(ln)<0) state.hidden.push(ln);
      else state.hidden=state.hidden.filter(function(h){ return h!==ln; });
      save(); renderAll();
      var back=document.querySelector('.lanechip[data-lane="'+ln+'"]'); if (back) back.focus();
      return;
    }
    // Reset puts the plan's dates back but keeps added people and hidden rows.
    if (e.target.closest('#reset')){ var keep={custom:state.custom,hidden:state.hidden,names:state.names}; state=clone(DEF); state.custom=keep.custom; state.hidden=keep.hidden; state.names=keep.names; save(); renderAll(); return; }
    var b=e.target.closest('.st, .tog, .rm'); if(!b) return;
    var act=b.getAttribute('data-act'), d=Number(b.getAttribute('data-d')||0), pid=b.getAttribute('data-p'), m=me(), f=state.fr;
    var th = pid && state.th[pid], tlen = m.china ? m.ce-m.cs+1 : 1;
    var cp = pid && state.custom.filter(function(c){ return c.id===pid; })[0], ci=Number(b.getAttribute('data-i')), cx = cp && cp.stays[ci];
    if (act==='crm'){ cp.stays.splice(ci,1); if (!cp.stays.length) state.custom=state.custom.filter(function(c){ return c!==cp; }); }
    else if (act==='cst') cx.start=clamp(cx.start+d,0,N-1);
    else if (act==='cln') cx.len=clamp(cx.len+d,0,N);
    else if (act==='thtog') th.on=!th.on;
    else if (act==='ths') th.s=clamp(th.s+d,0,Math.max(0,tlen-1-th.e));
    else if (act==='the') th.e=clamp(th.e-d,0,Math.max(0,tlen-1-th.s));
    else if (act==='caltog') state.cal.on=!state.cal.on;
    else if (act==='calday'){
      var nd=state.cal.day;
      do { nd+=d; } while (nd>=0 && nd<N && (day(nd).getUTCDay()===0 || day(nd).getUTCDay()===6));
      if (nd>=0 && nd<N) state.cal.day=nd;
    }
    else if (act==='frsh') f.sh=!f.sh;
    else if (act==='frchina') f.china=!f.china;
    else if (act==='frshstart') f.shStart=clamp(f.shStart+d,0,N-1);
    else if (act==='frshlen') f.shLen=clamp(f.shLen+d,0,12);
    else if (act==='frhkstart') f.hkStart=clamp(f.hkStart+d,ix(11,1),f.hkEnd);
    else if (act==='frhkend') f.hkEnd=clamp(f.hkEnd+d,f.hkStart,N-1);
    else if (act==='sh') state.shLen=clamp(state.shLen+d,0,12);
    else if (act==='route') state.routeLen=clamp(state.routeLen+d,0,12);
    else if (act==='cstart') state.chinaStart=clamp(m.cs0+d,m.hk,W1);
    else if (act==='clen') state.chinaLen=clamp(Math.min(state.chinaLen,W1-m.cs0+1)+d,0,W1-m.cs0+1);
    else if (act==='start') state.p[pid].start=clamp(state.p[pid].start+d,0,N-1);
    else if (act==='len'){ var k2=Number(b.getAttribute('data-i')); state.p[pid].lens[k2]=clamp(state.p[pid].lens[k2]+d,0,N); }
    save(); renderAll();
    var again=document.querySelector('[data-act="'+act+'"]'+(b.hasAttribute('data-d')?'[data-d="'+d+'"]':'')+(pid?'[data-p="'+pid+'"]':'')+(b.hasAttribute('data-i')?'[data-i="'+b.getAttribute('data-i')+'"]':''));
    if (again) again.focus();
  });
  document.addEventListener('input',function(e){
    var el=e.target; if (!el.matches('input[data-nm]')) return;
    var id=el.getAttribute('data-nm'), k=Number(el.getAttribute('data-k')), cur=(state.names[id]||['','']).slice();
    cur[k]=el.value.trim().slice(0,40);
    if (!cur[0] && !cur[1]) delete state.names[id]; else state.names[id]=cur;
    save(); renderAll();
  });
  document.addEventListener('submit',function(e){
    if (e.target.id!=='addform') return;
    e.preventDefault();
    var name=document.getElementById('af-name').value.trim().slice(0,40);
    if (!name){ document.getElementById('af-name').focus(); return; }
    var place=(document.getElementById('af-place').value.trim()||tr('Trip','行程')).slice(0,40);
    var start=clamp(Number(document.getElementById('af-start').value)||0,0,N-1);
    var len=clamp(parseInt(document.getElementById('af-len').value,10)||1,1,N);
    var p=state.custom.filter(function(c){ return c.name.toLowerCase()===name.toLowerCase(); })[0];
    if (!p){ p={id:'c'+Date.now().toString(36), name:name, stays:[]}; state.custom.push(p); }
    p.stays.push({place:place,start:start,len:len});
    state.hidden=state.hidden.filter(function(h){ return h!==p.id; });
    save(); renderAll();
    document.getElementById('af-name').value=''; document.getElementById('af-place').value='';
    document.getElementById('af-msg').textContent=tr('Added '+name+' · '+place+' · '+range(start,start+len-1),'已新增 '+name+' · '+place+' · '+range(start,start+len-1));
  });
  document.addEventListener('change',function(e){
    if(!e.target.matches('.check input')) return;
    var done={};
    try{ done=JSON.parse(localStorage.getItem('wt-checks')||'{}')||{}; }catch(err){}
    done[e.target.getAttribute('data-id')]=e.target.checked;
    try{ localStorage.setItem('wt-checks',JSON.stringify(done)); }catch(err){}
  });

  function renderAll(){ var m=me(); applyLang(); renderTimeline(m); renderEditor(m); renderText(m); renderChecks(m); renderNames(); syncToggles(); }
  renderTZ(); renderAll();
})();
</script>
